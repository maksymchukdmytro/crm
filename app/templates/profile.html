{% extends "base.html" %}
{% block title %}Профіль{% endblock %}
{% block content %}
<div class="head"><h1>Мій профіль</h1></div>
<form method="post" class="card narrow form">
  <label>Логін<input value="{{ user.username }}" disabled></label>
  <label>Ім'я<input name="full_name" value="{{ user.full_name }}"></label>
  <h3>Зміна пароля</h3>
  <label>Поточний пароль<input type="password" name="old_password" autocomplete="current-password"></label>
  <label>Новий пароль<input type="password" name="new_password" minlength="8" autocomplete="new-password"></label>
  <button class="btn primary">Зберегти</button>
</form>
{% endblock %}
