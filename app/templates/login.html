{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block bare %}
<div class="login-wrap">
  <form method="post" action="{{ R }}/login" class="login card">
    <div class="brand dark"><span class="brand-mark"></span><span>CRM</span></div>
    <h1>Вхід до системи</h1>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Логін<input name="username" autocomplete="username" autofocus required></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide">Увійти</button>
  </form>
</div>
{% endblock %}
