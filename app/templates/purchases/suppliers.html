{% extends "base.html" %}
{% block title %}Постачальники — {{ company }}{% endblock %}
{% block content %}
<div class="head"><div class="order-head"><a href="{{ R }}/purchases" class="btn sm">←</a><h1>Постачальники</h1></div></div>
<div class="grid two">
  <div class="card flush">
    <table class="t">
      <thead><tr><th>Назва</th><th>Телефон</th><th>Коментар</th><th></th></tr></thead>
      {% for s in suppliers %}
      <tr><td colspan="4" style="padding:0">
        <form method="post" action="{{ R }}/suppliers" class="row" style="padding:8px 10px;align-items:center">
          <input type="hidden" name="id" value="{{ s.id }}">
          <input name="name" value="{{ s.name }}" required style="flex:2">
          <input name="phone" value="{{ s.phone }}" style="flex:1">
          <input name="comment" value="{{ s.comment }}" style="flex:2">
          <button class="btn sm">Зберегти</button>
        </form></td></tr>
      {% else %}<tr><td colspan="4"><div class="empty">Постачальників ще немає</div></td></tr>{% endfor %}
    </table>
  </div>
  <form method="post" action="{{ R }}/suppliers" class="card form">
    <h2>Новий постачальник</h2>
    <label>Назва<input name="name" required></label>
    <label>Телефон<input name="phone"></label>
    <label>Коментар<textarea name="comment" rows="2"></textarea></label>
    <button class="btn primary mt">Додати</button>
  </form>
</div>
{% endblock %}
