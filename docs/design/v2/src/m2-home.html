<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Головна</title>
<link rel="stylesheet" href="base.css"><script src="icons.js"></script><script src="m2.js"></script>
<style>
.mini { display: flex; gap: 8px; padding: 0 16px; overflow: hidden; }
.mc { flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 8px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.mc .ic { width: 36px; height: 36px; border-radius: 99px; }
.mc b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.mc span.l { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
.hero { background: #1C1C1A; color: #fff; border-radius: 24px; padding: 18px 18px 16px; }
.hero .v { display: flex; align-items: baseline; gap: 4px; font-size: 40px; line-height: 1; font-weight: 650; letter-spacing: -.035em; margin-top: 10px; }
.hero .v small { font-size: 22px; color: rgba(255,255,255,.45); font-weight: 500; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 46px; margin-top: 16px; }
.bars i { flex: 1; border-radius: 6px; background: rgba(255,255,255,.14); }
.bars i.on { background: #6E9BF5; }
.days { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,.45); }
.k4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kc { background: #fff; border-radius: 20px; padding: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.kc .top { display: flex; align-items: center; justify-content: space-between; }
.kc .v { margin-top: 12px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.kc .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.dl { font-size: 11.5px; font-weight: 700; padding: 3px 7px; border-radius: 99px; }
.dl.up { background: #E6F5EC; color: #17663D; } .dl.dn { background: #FCE9E8; color: #B42318; }
.tp { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.tp + .tp { border-top: 1px solid #F2F2F0; }
</style></head>
<body><div class="phone" id="p"></div>
<script>
const days = [9, 14, 6, 11, 4, 3, 18];
document.getElementById("p").innerHTML = `
<div class="hdr"><span class="av" style="width:42px;height:42px;font-size:15px">А</span>
  <div style="flex:1;line-height:1.2"><div style="font-size:13px;color:var(--muted)">Пʼятниця, 30 жовтня</div><div style="font-size:17px;font-weight:650">Привіт, Адміністраторе</div></div>
  <span class="cb">${icon("search")}</span><span class="cb">${icon("bell")}<span class="badge">1</span></span></div>
<div class="mini" style="margin:6px 0 2px">
  <span class="mc"><span class="ic red">${icon("inbox")}</span><span><b>4</b><span class="l">нові ліди</span></span></span>
  <span class="mc"><span class="ic orange">${icon("clock")}</span><span><b>16</b><span class="l">несортовані</span></span></span>
  <span class="mc"><span class="ic blue">${icon("box")}</span><span><b>2</b><span class="l">до відправки</span></span></span>
  <span class="mc"><span class="ic violet">${icon("pin")}</span><span><b>1</b><span class="l">на пошті</span></span></span>
</div>
<div class="body" style="padding-top:12px">
  <section class="hero">
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:14px;color:rgba(255,255,255,.7)">Продано сьогодні · 5 замовлень</span><span class="dl up" style="background:rgba(110,231,160,.16);color:#7EE2A8">↗ 11%</span></div>
    <div class="v">18 896<small>₴</small></div>
    <div class="bars">${days.map((d, i) => `<i class="${i === 6 ? "on" : ""}" style="height:${d / 18 * 100}%"></i>`).join("")}</div>
    <div class="days"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>сьогодні</span></div>
  </section>
  <div class="k4">
    <div class="kc"><div class="top"><span class="ic blue">${icon("calendar")}</span><span class="dl up">+9%</span></div><div class="v">130 020 ₴</div><div class="l">за жовтень</div></div>
    <div class="kc"><div class="top"><span class="ic green">${icon("wallet")}</span><span class="dl up">+4%</span></div><div class="v">3 334 ₴</div><div class="l">середній чек</div></div>
    <div class="kc"><div class="top"><span class="ic violet">${icon("check")}</span><span class="dl up">+3 п.</span></div><div class="v">72%</div><div class="l">апрув</div></div>
    <div class="kc"><div class="top"><span class="ic orange">${icon("truck")}</span><span class="dl dn">−2 п.</span></div><div class="v">78%</div><div class="l">викуп</div></div>
  </div>
  <section class="blk">
    <div class="sh"><span class="ttl">Топ товарів</span><span class="all">Усі →</span></div>
    ${[["Павербанк Volt 20 000", "142 шт", "227 058 ₴"], ["Чохол MagSafe", "118 шт", "52 982 ₴"]].map(([n, q, s]) => `<div class="tp"><span class="thumb" style="width:44px;height:44px">${icon("box")}</span><span style="flex:1;min-width:0"><b style="display:block;font-weight:600;font-size:15px" class="ell">${n}</b><span class="muted" style="font-size:13px">${q}</span></span><b class="num" style="font-weight:650">${s}</b></div>`).join("")}
  </section>
</div>
${dock("home")}`;
document.body.dataset.ready = 1;
</script></body></html>
