<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Картка — далі</title>
<link rel="stylesheet" href="base.css"><script src="icons.js"></script><script src="m2.js"></script>
<style>
.gl { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.gl + .gl { border-top: 1px solid #F2F2F0; }
.qty { display: inline-flex; align-items: center; gap: 14px; height: 32px; padding: 0 12px; border-radius: 99px; background: #F4F5F7; font-size: 14px; margin-top: 6px; }
.qty span { color: var(--muted); font-size: 16px; }
.offers { display: flex; gap: 8px; overflow: hidden; margin-top: 4px; }
.of { flex: none; width: 130px; border-radius: 16px; background: #F7F8FA; padding: 10px; }
.of .thumb { width: 100%; height: 64px; border-radius: 12px; }
.of b { display: block; font-size: 13px; font-weight: 600; margin-top: 8px; }
.of .r { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 13px; }
.of .add { width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.of .add svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.tot { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #F2F2F0; font-size: 14px; }
.tot div { display: flex; justify-content: space-between; }
.tot span:first-child { color: var(--muted); }
.kv { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
.kv .lbl2 { font-size: 12px; color: var(--muted); }
.kv b { display: block; font-size: 15px; font-weight: 600; }
.np { height: 30px; width: 30px; border-radius: 9px; background: #E53935; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; flex: none; }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 16px; background: #EAF1FE; color: #1F54C4; font-weight: 650; font-size: 15px; margin-top: 12px; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 26px; background: linear-gradient(180deg, rgba(242,243,245,0), #F2F3F5 30%); display: flex; gap: 10px; }
.foot .b { flex: 1; height: 54px; border-radius: 18px; background: #1C1C1A; color: #fff; font-weight: 650; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
</style></head>
<body><div class="phone" id="p"></div>
<script>
document.getElementById("p").innerHTML = `
<div class="body" style="padding-top:16px;gap:12px;padding-bottom:100px">
  <section class="blk">
    <div class="sh"><span class="ic violet" style="width:34px;height:34px;border-radius:10px">${icon("box")}</span><span class="ttl">Товари <span class="muted" style="font-weight:500;font-size:13px">2</span></span><span class="all">+ Товар</span></div>
    <div class="gl"><span class="thumb" style="width:56px;height:56px;border-radius:14px">${icon("box")}</span>
      <div style="flex:1;min-width:0"><b style="display:block;font-size:15.5px;font-weight:600" class="ell">Кавоварка Delonghi</b><span class="qty"><span>−</span><b>1</b><span>+</span></span></div>
      <b class="num" style="font-size:16px;font-weight:700">2 499<span class="cur">₴</span></b></div>
    <div class="gl"><span class="thumb" style="width:56px;height:56px;border-radius:14px">${icon("box")}</span>
      <div style="flex:1;min-width:0"><span style="font-size:11.5px;font-weight:700;color:#5A3FB8;background:#F0ECFC;padding:2px 7px;border-radius:99px">допродаж</span><b style="display:block;font-size:15px;font-weight:600;margin-top:3px" class="ell">Набір капсул 50 шт</b></div>
      <b class="num" style="font-size:16px;font-weight:700">349<span class="cur">₴</span></b></div>
    <div style="font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:600">Часто беруть разом</div>
    <div class="offers">
      <div class="of"><span class="thumb">${icon("box")}</span><b class="ell">Адаптер Lightning</b><div class="r"><span class="num">349 ₴</span><span class="add">${icon("plus")}</span></div></div>
      <div class="of"><span class="thumb">${icon("box")}</span><b class="ell">Карта пам'яті 64 ГБ</b><div class="r"><span class="num">399 ₴</span><span class="add">${icon("plus")}</span></div></div>
      <div class="of"><span class="thumb">${icon("box")}</span><b class="ell">Чохол</b><div class="r"><span class="num">299 ₴</span><span class="add">${icon("plus")}</span></div></div>
    </div>
    <div class="tot"><div><span>Знижка</span><span class="num">0 ₴</span></div><div><span>Прибуток</span><b class="num" style="color:#17663D">1 048 ₴</b></div></div>
  </section>
  <section class="blk">
    <div class="sh"><span class="ic green" style="width:34px;height:34px;border-radius:10px">${icon("wallet")}</span><span class="ttl">Оплата</span><span class="all">+ Оплата</span></div>
    <div class="kv"><div style="flex:1"><div class="lbl2">Вид оплати</div><b>Післяплата</b></div><div style="text-align:right"><div class="lbl2">У ТТН</div><b class="num">2 848 ₴</b></div></div>
  </section>
  <section class="blk">
    <div class="sh"><span class="ic blue" style="width:34px;height:34px;border-radius:10px">${icon("truck")}</span><span class="ttl">Доставка</span></div>
    <div class="kv"><span class="np">НП</span><div style="flex:1;min-width:0"><b class="ell">Тульчин · Відділення №3</b><div class="lbl2">платить одержувач</div></div>${icon("right")}</div>
    <div class="cta">${icon("truck")}Створити ТТН</div>
  </section>
</div>
<div class="foot"><span class="cb" style="width:54px;height:54px;border-radius:18px">${icon("phone")}</span><span class="b">${icon("check")}Прийняти замовлення</span></div>`;
document.body.dataset.ready = 1;
</script></body></html>
