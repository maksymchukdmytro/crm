<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Картка</title>
<link rel="stylesheet" href="base.css"><script src="icons.js"></script><script src="m2.js"></script>
<style>
.top { display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; }
.top .t { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
.top .t small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.who { display: flex; align-items: center; gap: 12px; }
.who .av { width: 48px; height: 48px; font-size: 16px; }
.msg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.msg span { height: 44px; border-radius: 14px; background: #F4F5F7; display: grid; place-items: center; color: var(--ink-2); }
.msg span.main { background: var(--accent); color: #fff; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding-top: 12px; border-top: 1px solid #F2F2F0; }
.facts div + div { border-left: 1px solid #F2F2F0; padding-left: 12px; }
.facts b { display: block; font-size: 15px; font-weight: 650; }
.facts span { font-size: 12px; color: var(--muted); }
.stbtn { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 18px; color: #fff; font-size: 16px; font-weight: 650; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { background: #fff; border-radius: 18px; padding: 12px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
.act .ic { width: 40px; height: 40px; border-radius: 99px; }
.todo { display: flex; align-items: center; gap: 12px; }
.ring { width: 44px; height: 44px; flex: none; }
.chk { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; background: #F4F5F7; font-size: 12.5px; font-weight: 500; }
.chk.done { background: #E6F5EC; color: #17663D; text-decoration: line-through; }
</style></head>
<body><div class="phone" id="p"></div>
<script>
const C = 2 * Math.PI * 18;
document.getElementById("p").innerHTML = `
<div class="top"><span class="cb">${icon("left")}</span><span class="t">Замовлення №27<small>30.10, 13:50 · лендинг</small></span><span class="cb">${icon("more")}</span></div>
<div class="body" style="padding-top:8px;gap:12px">
  <section class="blk">
    <div class="who"><span class="av">ОК</span><div style="flex:1;min-width:0"><div style="font-size:19px;font-weight:650;letter-spacing:-.015em" class="ell">Коваленко Олена</div><div class="muted num" style="font-size:14px">+380 67 111 22 33</div></div>
      <div style="text-align:right"><div class="num" style="font-size:20px;font-weight:700;letter-spacing:-.02em">2 499<span class="cur">₴</span></div><div class="muted" style="font-size:12px">до сплати</div></div></div>
    <div class="msg"><span class="main">${icon("phone")}</span><span>${icon("viber")}</span><span>${icon("send")}</span><span>${icon("chat")}</span></div>
    <div class="facts"><div><b>1</b><span>замовлення</span></div><div><b>—</b><span>викуп</span></div><div><b>Максимчук</b><span>юрособа ✓</span></div></div>
  </section>
  <div class="stbtn" style="background:${ST.u[1]}"><span style="width:10px;height:10px;border-radius:9px;background:#fff;opacity:.85"></span><span style="flex:1">Несортований</span><span style="font-size:13.5px;font-weight:500;opacity:.8">змінити</span>${icon("down")}</div>
  <div class="acts">
    <span class="act"><span class="ic blue">${icon("truck")}</span>ТТН</span>
    <span class="act"><span class="ic gray">${icon("printer")}</span>Друк</span>
    <span class="act"><span class="ic green">${icon("receipt")}</span>Чек</span>
    <span class="act"><span class="ic orange">${icon("bell")}</span>Нагадати</span>
  </div>
  <section class="blk todo">
    <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="#EEF0F2" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="#1E8A52" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C * .4} ${C}" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1C1C1A" font-family="Onest">2/5</text></svg>
    <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:650;margin-bottom:6px">Що лишилось</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chk">Оплата</span><span class="chk">ТТН</span><span class="chk">Видаткова</span></div></div>
  </section>
  <section class="blk">
    <div class="sh"><span class="ic violet" style="width:34px;height:34px;border-radius:10px">${icon("box")}</span><span class="ttl">Товари <span class="muted" style="font-weight:500;font-size:13px">1</span></span><span class="all">+ Товар</span></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="thumb" style="width:56px;height:56px;border-radius:14px">${icon("box")}</span>
      <div style="flex:1;min-width:0"><b style="display:block;font-size:15.5px;font-weight:600" class="ell">Кавоварка Delonghi</b><span class="muted" style="font-size:12.5px">ART-001 · на складі 12</span></div>
      <b class="num" style="font-size:16px;font-weight:700">2 499<span class="cur">₴</span></b></div>
  </section>
</div>`;
document.body.dataset.ready = 1;
</script></body></html>
